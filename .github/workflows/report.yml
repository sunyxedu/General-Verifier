name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/report/**'
      - 'script/build_report.py'
      - 'tests/test_report_build.py'
      - '.github/workflows/report.yml'
  pull_request:
    paths:
      - 'docs/report/**'
      - 'script/build_report.py'
      - 'tests/test_report_build.py'
      - '.github/workflows/report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the docs and reviewed source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install site dependencies
        run: python -m pip install -r docs/report/requirements.txt
      - name: Check the documentation build
        run: python -m unittest discover -s tests -p test_report_build.py -v
      - name: Build the documentation
        env:
          REPORT_REPOSITORY: ${{ github.repository }}
        run: python script/build_report.py --repository "$REPORT_REPOSITORY"
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One-time repository setup: Settings > Pages > Source > GitHub Actions.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show the documentation link
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '### Documentation\n\n[Read the documentation](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
