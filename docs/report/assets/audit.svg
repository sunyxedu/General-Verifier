<svg xmlns="http://www.w3.org/2000/svg" id="audit-diagram" width="1020" height="846" viewBox="0 0 1020 846" role="group" aria-labelledby="audit-title audit-desc" lang="en">
  <title id="audit-title">Execute and audit one candidate verification method</title>
  <desc id="audit-desc">Execute an eligible method and retain its artifacts. The kernel filters failures, unavailable results, and inadmissible evidence. The Judger audits substantive results for method sufficiency and faithful execution. Accept audited support or decisive refutation. An execution deviation may redo the same method up to three times; other rejected attempts move to method selection. Search exhaustion preserves a failure or availability gap, never automatic success.</desc>
  <defs>
    <marker id="audit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39434d"/></marker>
    <style>
      #audit-diagram text { font-family: Arial, Helvetica, sans-serif; fill: #202830; font-size: 16px; }
      #audit-diagram .heading { font-size: 18px; font-weight: 700; }
      #audit-diagram .small { font-size: 14px; fill: #46515c; }
      #audit-diagram .label { font-size: 14px; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
      #audit-diagram .node { fill: white; stroke: #59636d; stroke-width: 1.2; }
      #audit-diagram .group { fill: white; stroke: #a3aab1; stroke-width: 1; }
      #audit-diagram .optional { stroke-dasharray: 5 4; }
      #audit-diagram .flow { fill: none; stroke: #39434d; stroke-width: 1.4; marker-end: url(#audit-arrow); }
      #audit-diagram a:hover .node, #audit-diagram a:focus .node { fill: #eef4fa; stroke: #245f9e; stroke-width: 2; }
      #audit-diagram a { cursor: pointer; }
      #audit-diagram a:focus { outline: none; }
    </style>
  </defs>
  <rect width="1020" height="846" fill="white"/>
  <rect x="330" y="18" width="310" height="48" rx="24" class="node"/>
  <text x="485.0" y="47.0" text-anchor="middle" class="">One eligible candidate method</text>
  <path d="M485 66 V100" class="flow"/>
  <rect x="330" y="100" width="310" height="60" rx="4" class="node"/>
  <text x="485.0" y="124.5" text-anchor="middle" class="">Executor: run the fixed method</text>
  <text x="485.0" y="145.5" text-anchor="middle" class="">Save result, witness, and artifacts</text>
  <path d="M485 160 V197" class="flow"/>
  <path d="M485.0 197 L615 255.0 L485.0 313 L355 255.0 Z" class="node"/>
  <text x="485.0" y="249.5" text-anchor="middle" class="">Result passes</text>
  <text x="485.0" y="270.5" text-anchor="middle" class="">kernel gates?</text>
  <path d="M485 313 V354" class="flow"/>
  <text x="512" y="341" text-anchor="middle" class="label">Yes</text>
  <rect x="330" y="354" width="310" height="60" rx="4" class="node"/>
  <text x="485.0" y="378.5" text-anchor="middle" class="">Judger: inspect the artifacts</text>
  <text x="485.0" y="399.5" text-anchor="middle" class="">Audit sufficiency and faithfulness</text>
  <path d="M485 414 V452" class="flow"/>
  <path d="M485.0 452 L615 515.0 L485.0 578 L355 515.0 Z" class="node"/>
  <text x="485.0" y="509.5" text-anchor="middle" class="">Sufficient</text>
  <text x="485.0" y="530.5" text-anchor="middle" class="">and faithful?</text>
  <path d="M485 578 V688" class="flow"/>
  <text x="512" y="629" text-anchor="middle" class="label">Yes</text>
  <rect x="330" y="688" width="310" height="68" rx="4" class="node"/>
  <text x="485.0" y="716.5" text-anchor="middle" class="">Accept this check result</text>
  <text x="485.0" y="737.5" text-anchor="middle" class="">Support or decisive refutation</text>
  <path d="M355 255 H160 V352" class="flow"/>
  <text x="255" y="241" text-anchor="middle" class="label">No</text>
  <rect x="24" y="352" width="272" height="76" rx="4" class="node"/>
  <text x="160.0" y="384.5" text-anchor="middle" class="">Record the rejected attempt</text>
  <text x="160.0" y="405.5" text-anchor="middle" class="">Try another eligible method</text>
  <path d="M615 515 H751" class="flow"/>
  <text x="684" y="501" text-anchor="middle" class="label">No</text>
  <path d="M876.0 449 L1001 515.0 L876.0 581 L751 515.0 Z" class="node"/>
  <text x="876.0" y="499.0" text-anchor="middle" class="">Method sufficient;</text>
  <text x="876.0" y="520.0" text-anchor="middle" class="">execution deviated;</text>
  <text x="876.0" y="541.0" text-anchor="middle" class="">redo budget left?</text>
  <path d="M876 449 V299" class="flow"/>
  <text x="902" y="378" text-anchor="middle" class="label">Yes</text>
  <rect x="746" y="221" width="260" height="78" rx="4" class="node"/>
  <text x="876.0" y="244.0" text-anchor="middle" class="">Redo the same method</text>
  <text x="876.0" y="265.0" text-anchor="middle" class="">with execution feedback</text>
  <text x="876.0" y="286.0" text-anchor="middle" class="">Up to 3 redos</text>
  <path d="M876 221 V130 H640" class="flow"/>
  <path d="M876 581 V770 H10 V390 H24" class="flow"/>
  <text x="902" y="615" text-anchor="middle" class="label">No</text>
  <text x="160" y="470" text-anchor="middle" class="small">When method search ends,</text>
  <text x="160" y="491" text-anchor="middle" class="small">retain failure or an</text>
  <text x="160" y="512" text-anchor="middle" class="small">availability gap.</text>
  <text x="24" y="803" text-anchor="start" class="small">Rectangles are actions; diamonds are decisions. Arrow labels state when a path is taken.</text>
  <text x="24" y="827" text-anchor="start" class="small">The diagram expands one candidate. Method enumeration, tier gating, and search repair are described in the text.</text>
</svg>
