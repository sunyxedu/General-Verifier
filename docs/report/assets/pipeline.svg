<svg xmlns="http://www.w3.org/2000/svg" id="pipeline-diagram" width="1052" height="316" viewBox="0 0 1052 316" role="group" aria-labelledby="pipeline-title pipeline-desc" lang="en">
  <title id="pipeline-title">General Verifier workflow</title>
  <desc id="pipeline-desc">Read the four stages from left to right, and the actions within each stage from top to bottom. Reconstruct the run, define its checks, execute and audit verification methods, then produce a verdict and certificate. Ranking multiple runs is optional. Each action links to its explanation.</desc>
  <defs>
    <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#333"/></marker>
    <style>
      #pipeline-diagram text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111; }
      #pipeline-diagram .heading { font-weight: 700; }
      #pipeline-diagram .box { fill: #fff; stroke: #333; stroke-width: 1; }
      #pipeline-diagram .optional { stroke-dasharray: 4 3; }
      #pipeline-diagram .flow { fill: none; stroke: #333; stroke-width: 1; marker-end: url(#pipeline-arrow); }
      #pipeline-diagram a:hover .box, #pipeline-diagram a:focus .box { fill: #f0f5fa; stroke: #05b; }
      #pipeline-diagram a:focus { outline: none; }
    </style>
  </defs>
  <rect width="1052" height="316" fill="#fff"/>
  <rect x="11" y="8" width="244" height="170" rx="5" class="box"/>
  <path d="M11 36h244" fill="none" stroke="#333"/>
  <text x="133" y="27" text-anchor="middle" class="heading">Reconstruct the run</text>
  <a href="../getting-started.html#the-task-and-captured-run" target="_top" aria-label="Read: Read task and files">
    <rect x="33" y="54" width="200" height="34" rx="3" class="box"/>
    <text x="133" y="76" text-anchor="middle">Read task and files</text>
  </a>
  <path d="M133 88v28" class="flow"/>
  <a href="../workflow.html#five-objects-to-inspect" target="_top" aria-label="Read: Extract claims">
    <rect x="33" y="116" width="200" height="34" rx="3" class="box"/>
    <text x="133" y="138" text-anchor="middle">Extract claims</text>
  </a>
  <path d="M255 107h18" class="flow"/>
  <rect x="273" y="8" width="244" height="170" rx="5" class="box"/>
  <path d="M273 36h244" fill="none" stroke="#333"/>
  <text x="395" y="27" text-anchor="middle" class="heading">Define the checks</text>
  <a href="../contracts.html#task-contracts" target="_top" aria-label="Read: Compile checks">
    <rect x="295" y="54" width="200" height="34" rx="3" class="box"/>
    <text x="395" y="76" text-anchor="middle">Compile checks</text>
  </a>
  <path d="M395 88v28" class="flow"/>
  <a href="../contracts.html#review-and-repair" target="_top" aria-label="Read: Review the contract">
    <rect x="295" y="116" width="200" height="34" rx="3" class="box"/>
    <text x="395" y="138" text-anchor="middle">Review the contract</text>
  </a>
  <path d="M517 107h18" class="flow"/>
  <rect x="535" y="8" width="244" height="236" rx="5" class="box"/>
  <path d="M535 36h244" fill="none" stroke="#333"/>
  <text x="657" y="27" text-anchor="middle" class="heading">Establish evidence</text>
  <a href="../evidence.html#evidence-strength" target="_top" aria-label="Read: Propose a method">
    <rect x="557" y="54" width="200" height="34" rx="3" class="box"/>
    <text x="657" y="76" text-anchor="middle">Propose a method</text>
  </a>
  <path d="M657 88v28" class="flow"/>
  <a href="../evidence.html#execution-and-audit" target="_top" aria-label="Read: Execute the method">
    <rect x="557" y="116" width="200" height="34" rx="3" class="box"/>
    <text x="657" y="138" text-anchor="middle">Execute the method</text>
  </a>
  <path d="M657 150v28" class="flow"/>
  <a href="../evidence.html#execution-and-audit" target="_top" aria-label="Read: Audit the evidence">
    <rect x="557" y="178" width="200" height="34" rx="3" class="box"/>
    <text x="657" y="200" text-anchor="middle">Audit the evidence</text>
  </a>
  <path d="M779 107h18" class="flow"/>
  <rect x="797" y="8" width="244" height="236" rx="5" class="box"/>
  <path d="M797 36h244" fill="none" stroke="#333"/>
  <text x="919" y="27" text-anchor="middle" class="heading">Produce the result</text>
  <a href="../results.html#five-verdicts" target="_top" aria-label="Read: Combine final checks">
    <rect x="819" y="54" width="200" height="34" rx="3" class="box"/>
    <text x="919" y="76" text-anchor="middle">Combine final checks</text>
  </a>
  <path d="M919 88v28" class="flow"/>
  <a href="../results.html#follow-the-evidence-in-a-certificate" target="_top" aria-label="Read: Save the certificate">
    <rect x="819" y="116" width="200" height="34" rx="3" class="box"/>
    <text x="919" y="138" text-anchor="middle">Save the certificate</text>
  </a>
  <path d="M919 150v28" class="flow"/>
  <a href="../results.html#rank-several-candidates" target="_top" aria-label="Read: Rank candidate runs">
    <rect x="819" y="178" width="200" height="34" rx="3" class="box optional"/>
    <text x="919" y="200" text-anchor="middle">Rank candidate runs</text>
  </a>
  <rect x="690" y="275" width="172" height="30" rx="3" class="box"/>
  <text x="776" y="295" text-anchor="middle">Core action</text>
  <rect x="868" y="275" width="172" height="30" rx="3" class="box optional"/>
  <text x="954" y="295" text-anchor="middle">Optional action</text>
</svg>
