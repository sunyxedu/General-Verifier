<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="264" viewBox="0 0 1000 264" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">The five stages of General Verifier</title>
  <desc id="desc">Input preparation identifies the task and capture. The Extractor reconstructs claims. The Compiler and Critic generate and review obligations. The Oracle, Executor, and Judger propose, execute, and audit methods. The kernel combines results and evidence into a certificate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#84929f"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#273444}
      .step{font-size:13px;fill:#64748b}
      .name{font-size:18px;font-weight:600}
      .detail{font-size:14px;fill:#536373}
      .role{font-size:12px;fill:#476b93}
      .arrow{stroke:#84929f;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .box{fill:#f7f9fb;stroke:#d7e0e7;rx:8}
    </style>
  </defs>
  <rect width="1000" height="264" fill="#fff"/>
  <text x="20" y="27" class="step">Captured inputs define what can be checked. The certificate retains the evidence behind each result.</text>
  <rect x="20" y="50" width="160" height="147" class="box"/>
  <text x="37" y="78" class="step">01 / PREPARE</text>
  <text x="37" y="113" class="name">Task + files</text>
  <text x="37" y="143" class="detail">Task, tool records</text>
  <text x="37" y="168" class="detail">Final answer, files</text>
  <path d="M181 123H211" class="arrow"/>
  <rect x="220" y="50" width="160" height="147" class="box"/>
  <text x="237" y="78" class="step">02 / EXTRACT</text>
  <text x="237" y="113" class="name">Claim graph</text>
  <text x="237" y="143" class="detail">Claims + premises</text>
  <text x="237" y="172" class="role">Extractor</text>
  <path d="M381 123H411" class="arrow"/>
  <rect x="420" y="50" width="160" height="147" class="box"/>
  <text x="437" y="78" class="step">03 / COMPILE</text>
  <text x="437" y="113" class="name">Obligations</text>
  <text x="437" y="143" class="detail">Required checks</text>
  <text x="437" y="172" class="role">Compiler · Critic</text>
  <path d="M581 123H611" class="arrow"/>
  <rect x="620" y="50" width="160" height="147" class="box"/>
  <text x="637" y="78" class="step">04 / CHECK</text>
  <text x="637" y="113" class="name">Evidence</text>
  <text x="637" y="143" class="detail">Methods + audit</text>
  <text x="637" y="168" class="role">Oracle · Executor</text>
  <text x="637" y="186" class="role">Judger</text>
  <path d="M781 123H811" class="arrow"/>
  <rect x="820" y="50" width="160" height="147" rx="8" fill="#eef5fc" stroke="#9cb5cf"/>
  <text x="837" y="78" class="step">05 / CERTIFY</text>
  <text x="837" y="113" class="name">Certificate</text>
  <text x="837" y="143" class="detail">Verdict + evidence</text>
  <text x="837" y="172" class="role">Kernel</text>
  <path d="M20 223H980" stroke="#e2e7ed"/>
  <text x="20" y="249" class="detail">Final task checks determine the verdict. Certificates can also help rank candidate runs for the same task.</text>
</svg>
