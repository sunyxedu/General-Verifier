<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="264" viewBox="0 0 1000 264" role="img" aria-labelledby="title desc">
  <title id="title">GV 的五个处理阶段</title>
  <desc id="desc">输入准备确定任务与捕获物；提取器重建声明；Compiler 与 Critic 生成并审查检查条件；Oracle、Executor、Judger 选择、执行并审查方法；内核汇总结果和证据，生成证书。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#84929f"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#273444}
      .step{font-size:13px;fill:#64748b}
      .name{font-size:20px;font-weight:600}
      .detail{font-size:15px;fill:#536373}
      .role{font-size:12px;fill:#476b93}
      .arrow{stroke:#84929f;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
      .box{fill:#f7f9fb;stroke:#d7e0e7;rx:8}
    </style>
  </defs>
  <rect width="1000" height="264" fill="#fff"/>
  <text x="20" y="27" class="step">输入决定可检查的范围；证书保留每一步的依据。</text>
  <rect x="20" y="50" width="160" height="147" class="box"/>
  <text x="37" y="78" class="step">01 / 输入准备</text>
  <text x="37" y="113" class="name">任务与捕获物</text>
  <text x="37" y="143" class="detail">原任务、记录</text>
  <text x="37" y="168" class="detail">回答、交付物</text>
  <path d="M181 123H211" class="arrow"/>
  <rect x="220" y="50" width="160" height="147" class="box"/>
  <text x="237" y="78" class="step">02 / 声明提取</text>
  <text x="237" y="113" class="name">声明及其依赖</text>
  <text x="237" y="143" class="detail">重建论证结构</text>
  <text x="237" y="172" class="role">Extractor</text>
  <path d="M381 123H411" class="arrow"/>
  <rect x="420" y="50" width="160" height="147" class="box"/>
  <text x="437" y="78" class="step">03 / 检查生成</text>
  <text x="437" y="113" class="name">明确成功条件</text>
  <text x="437" y="143" class="detail">检查遗漏与多余</text>
  <text x="437" y="172" class="role">Compiler · Critic</text>
  <path d="M581 123H611" class="arrow"/>
  <rect x="620" y="50" width="160" height="147" class="box"/>
  <text x="637" y="78" class="step">04 / 执行与审查</text>
  <text x="637" y="113" class="name">建立检查证据</text>
  <text x="637" y="143" class="detail">选方法、执行、审查</text>
  <text x="637" y="168" class="role">Oracle · Executor</text>
  <text x="637" y="186" class="role">Judger</text>
  <path d="M781 123H811" class="arrow"/>
  <rect x="820" y="50" width="160" height="147" rx="8" fill="#eef5fc" stroke="#9cb5cf"/>
  <text x="837" y="78" class="step">05 / 证书生成</text>
  <text x="837" y="113" class="name">判定与证据引用</text>
  <text x="837" y="143" class="detail">汇总通过项与缺口</text>
  <text x="837" y="172" class="role">Kernel · Certificate</text>
  <path d="M20 223H980" stroke="#e2e7ed"/>
  <text x="20" y="249" class="detail">最终判定来自最终任务检查；保留的证书还可以用于比较同一任务的多个候选。</text>
</svg>
