<svg xmlns="http://www.w3.org/2000/svg" id="settle-diagram" width="980" height="740" viewBox="0 0 980 740" role="group" aria-labelledby="settle-title settle-desc" lang="en">
  <title id="settle-title">How obligation outcomes become a claim status</title>
  <desc id="settle-desc">The kernel folds the outcomes of a claim&#x27;s obligations in a fixed order. A refuted must obligation refutes the claim. A violated should obligation lowers it to partial. If everything holds, the claim is verified unless it is a final claim with no world-basis evidence, which abstains as unverified. Holds mixed only with unobtainable checks give partial. Anything else stays unverified.</desc>
  <defs>
    <marker id="settle-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39434d"/></marker>
    <style>
      #settle-diagram text { font-family: Arial, Helvetica, sans-serif; fill: #202830; font-size: 15px; }
      #settle-diagram .heading { font-size: 16px; font-weight: 700; }
      #settle-diagram .small { font-size: 13px; fill: #46515c; }
      #settle-diagram .mono { font-family: "Roboto Mono", Menlo, Consolas, monospace; font-size: 13px; }
      #settle-diagram .label { font-size: 13px; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
      #settle-diagram .node { fill: white; stroke: #59636d; stroke-width: 1.2; }
      #settle-diagram .shade { fill: #f3f5f7; stroke: #59636d; stroke-width: 1.2; }
      #settle-diagram .group { fill: white; stroke: #a3aab1; stroke-width: 1; }
      #settle-diagram .optional { stroke-dasharray: 5 4; }
      #settle-diagram .flow { fill: none; stroke: #39434d; stroke-width: 1.4; marker-end: url(#settle-diagram-arrow); }
      #settle-diagram .dep { fill: none; stroke: #39434d; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#settle-diagram-arrow); }
      #settle-diagram .plain { fill: none; stroke: #a3aab1; stroke-width: 1; }
      #settle-diagram a:hover .node, #settle-diagram a:focus .node { fill: #eef4fa; stroke: #245f9e; stroke-width: 2; }
      #settle-diagram a { cursor: pointer; }
      #settle-diagram a:focus { outline: none; }
    </style>
  </defs>
  <rect width="980" height="740" fill="white"/>
  <rect x="130" y="20" width="340" height="48" rx="24" class="node"/>
  <text x="300.0" y="49.0" text-anchor="middle" class="">Outcomes of the claim&#x27;s obligations</text>
  <path d="M300 68v30" class="flow"/>
  <path d="M300 98.0 L460.0 150 L300 202.0 L140.0 150 Z" class="node"/>
  <text x="300" y="144.5" text-anchor="middle" class="">Any must obligation</text>
  <text x="300" y="165.5" text-anchor="middle" class="">refuted?</text>
  <path d="M460 150h120" class="flow"/>
  <text x="520" y="143.0" text-anchor="middle" class="label">yes</text>
  <rect x="580" y="118" width="380" height="64" rx="4" class="shade"/>
  <text x="770.0" y="144.5" text-anchor="middle" class="">refuted</text>
  <text x="770.0" y="165.5" text-anchor="middle" class="small">the deciding check&#x27;s basis and strength are kept</text>
  <path d="M300 202v30" class="flow"/>
  <text x="320" y="225.0" text-anchor="middle" class="label">no</text>
  <path d="M300 228.0 L480.0 290 L300 352.0 L120.0 290 Z" class="node"/>
  <text x="300" y="274.0" text-anchor="middle" class="">Only should obligations</text>
  <text x="300" y="295.0" text-anchor="middle" class="">refuted; the rest holds</text>
  <text x="300" y="316.0" text-anchor="middle" class="">or is unobtainable?</text>
  <path d="M480 290h100" class="flow"/>
  <text x="530" y="283.0" text-anchor="middle" class="label">yes</text>
  <rect x="580" y="258" width="380" height="64" rx="4" class="shade"/>
  <text x="770.0" y="284.5" text-anchor="middle" class="">partial</text>
  <text x="770.0" y="305.5" text-anchor="middle" class="small">advisory clause violated: recorded as a contrary signal</text>
  <path d="M300 348v30" class="flow"/>
  <text x="320" y="371.0" text-anchor="middle" class="label">no</text>
  <path d="M300 378.0 L450.0 430 L300 482.0 L150.0 430 Z" class="node"/>
  <text x="300" y="424.5" text-anchor="middle" class="">Every obligation</text>
  <text x="300" y="445.5" text-anchor="middle" class="">holds?</text>
  <path d="M450 430h110" class="flow"/>
  <text x="505" y="423.0" text-anchor="middle" class="label">yes</text>
  <path d="M690 375.0 L820.0 430 L690 485.0 L560.0 430 Z" class="node"/>
  <text x="690" y="424.5" text-anchor="middle" class="">Final claim with no</text>
  <text x="690" y="445.5" text-anchor="middle" class="">world-basis check?</text>
  <path d="M820 430h30" class="flow"/>
  <text x="835" y="423.0" text-anchor="middle" class="label">yes</text>
  <rect x="850" y="398" width="120" height="64" rx="4" class="shade"/>
  <text x="910.0" y="424.5" text-anchor="middle" class="">unverified</text>
  <text x="910.0" y="445.5" text-anchor="middle" class="small">abstain</text>
  <path d="M690 485v53" class="flow"/>
  <text x="712" y="517.0" text-anchor="middle" class="label">no</text>
  <rect x="540" y="538" width="420" height="78" rx="4" class="shade"/>
  <text x="750.0" y="562.0" text-anchor="middle" class="">verified</text>
  <text x="750.0" y="582.0" text-anchor="middle" class="small">basis is world only if every check was world</text>
  <text x="750.0" y="602.0" text-anchor="middle" class="small">strength is the weakest link; below decisive reads as supported</text>
  <path d="M300 482v30" class="flow"/>
  <text x="320" y="505.0" text-anchor="middle" class="label">no</text>
  <path d="M300 512.0 L470.0 570 L300 628.0 L130.0 570 Z" class="node"/>
  <text x="300" y="564.5" text-anchor="middle" class="">At least one unobtainable,</text>
  <text x="300" y="585.5" text-anchor="middle" class="">and the rest holds?</text>
  <path d="M470 570h30v80h40" class="flow"/>
  <text x="500" y="563.0" text-anchor="middle" class="label">yes</text>
  <rect x="540" y="618" width="420" height="64" rx="4" class="shade"/>
  <text x="750.0" y="644.5" text-anchor="middle" class="">partial</text>
  <text x="750.0" y="665.5" text-anchor="middle" class="small">a necessary check is unavailable inside this evidence boundary</text>
  <path d="M300 628v30" class="flow"/>
  <text x="320" y="651.0" text-anchor="middle" class="label">no</text>
  <rect x="130" y="658" width="340" height="56" rx="4" class="shade"/>
  <text x="300.0" y="682.0" text-anchor="middle" class="">unverified</text>
  <text x="300.0" y="700.0" text-anchor="middle" class="small">a check failed or stayed unresolved; a later run may retry it</text>
</svg>
