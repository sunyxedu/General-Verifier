<svg xmlns="http://www.w3.org/2000/svg" id="components-diagram" width="1040" height="640" viewBox="0 0 1040 640" role="group" aria-labelledby="components-title components-desc" lang="en">
  <title id="components-title">Components and data flow</title>
  <desc id="components-desc">An agent run leaves captured inputs in a state directory. The verifier turns the tool feed into a ledger, builds a claim graph, and the kernel verifies claims by compiling obligations and binding evidence to them. All roles are model agents with fixed tool palettes. Results are content-addressed artifacts and a certificate.</desc>
  <defs>
    <marker id="components-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39434d"/></marker>
    <style>
      #components-diagram text { font-family: Arial, Helvetica, sans-serif; fill: #202830; font-size: 15px; }
      #components-diagram .heading { font-size: 16px; font-weight: 700; }
      #components-diagram .small { font-size: 13px; fill: #46515c; }
      #components-diagram .mono { font-family: "Roboto Mono", Menlo, Consolas, monospace; font-size: 13px; }
      #components-diagram .label { font-size: 13px; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
      #components-diagram .node { fill: white; stroke: #59636d; stroke-width: 1.2; }
      #components-diagram .shade { fill: #f3f5f7; stroke: #59636d; stroke-width: 1.2; }
      #components-diagram .group { fill: white; stroke: #a3aab1; stroke-width: 1; }
      #components-diagram .optional { stroke-dasharray: 5 4; }
      #components-diagram .flow { fill: none; stroke: #39434d; stroke-width: 1.4; marker-end: url(#components-diagram-arrow); }
      #components-diagram .dep { fill: none; stroke: #39434d; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#components-diagram-arrow); }
      #components-diagram .plain { fill: none; stroke: #a3aab1; stroke-width: 1; }
      #components-diagram a:hover .node, #components-diagram a:focus .node { fill: #eef4fa; stroke: #245f9e; stroke-width: 2; }
      #components-diagram a { cursor: pointer; }
      #components-diagram a:focus { outline: none; }
    </style>
  </defs>
  <rect width="1040" height="640" fill="white"/>
  <rect x="16" y="16" width="250" height="270" rx="5" class="group"/>
  <path d="M16 46h250" class="plain"/>
  <text x="141.0" y="36.0" text-anchor="middle" class="heading">Agent run</text>
  <rect x="36" y="60" width="210" height="54" rx="4" class="node"/>
  <text x="141.0" y="81.5" text-anchor="middle" class="">Claude Code or Codex</text>
  <text x="141.0" y="102.5" text-anchor="middle" class="">solving the task</text>
  <rect x="36" y="130" width="210" height="54" rx="4" class="node"/>
  <text x="141.0" y="151.5" text-anchor="middle" class="">Recording hooks</text>
  <text x="141.0" y="172.5" text-anchor="middle" class="small">PreToolUse / PostToolUse</text>
  <rect x="36" y="200" width="210" height="60" rx="4" class="node optional"/>
  <text x="141.0" y="224.5" text-anchor="middle" class="">MCP client (interactive)</text>
  <text x="141.0" y="245.5" text-anchor="middle" class="small">commit · verify · status · certificate</text>
  <path d="M141 114v16" class="flow"/>
  <path d="M141 184v16" class="flow"/>
  <rect x="310" y="16" width="250" height="270" rx="5" class="group"/>
  <path d="M310 46h250" class="plain"/>
  <text x="435.0" y="36.0" text-anchor="middle" class="heading">State directory</text>
  <rect x="330" y="60" width="210" height="124" rx="4" class="node"/>
  <text x="435.0" y="87.0" text-anchor="middle" class="">Captured inputs (sealed)</text>
  <text x="435.0" y="107.0" text-anchor="middle" class="mono">task.md · final.txt</text>
  <text x="435.0" y="127.0" text-anchor="middle" class="mono">hook_feed.jsonl</text>
  <text x="435.0" y="147.0" text-anchor="middle" class="mono">world/ + world_manifest.json</text>
  <text x="435.0" y="167.0" text-anchor="middle" class="mono">baseline/</text>
  <rect x="330" y="200" width="210" height="60" rx="4" class="node"/>
  <text x="435.0" y="217.0" text-anchor="middle" class="">Derived state</text>
  <text x="435.0" y="235.0" text-anchor="middle" class="mono">events.jsonl · claims.sqlite</text>
  <text x="435.0" y="253.0" text-anchor="middle" class="mono">artifacts/ · score.json</text>
  <path d="M246 157h84" class="flow"/>
  <text x="288" y="150.0" text-anchor="middle" class="label">tool feed</text>
  <rect x="604" y="16" width="420" height="270" rx="5" class="group"/>
  <path d="M604 46h420" class="plain"/>
  <text x="814.0" y="36.0" text-anchor="middle" class="heading">Verifier process</text>
  <rect x="624" y="60" width="180" height="54" rx="4" class="node"/>
  <text x="714.0" y="81.5" text-anchor="middle" class="">EventLog</text>
  <text x="714.0" y="102.5" text-anchor="middle" class="small">append-only ledger</text>
  <rect x="824" y="60" width="180" height="54" rx="4" class="node optional"/>
  <text x="914.0" y="81.5" text-anchor="middle" class="">Extractor role</text>
  <text x="914.0" y="102.5" text-anchor="middle" class="small">offline only</text>
  <rect x="624" y="136" width="180" height="54" rx="4" class="node"/>
  <text x="714.0" y="157.5" text-anchor="middle" class="">Builder</text>
  <text x="714.0" y="178.5" text-anchor="middle" class="small">events → claim graph</text>
  <rect x="824" y="136" width="180" height="54" rx="4" class="node"/>
  <text x="914.0" y="157.5" text-anchor="middle" class="">ClaimStore</text>
  <text x="914.0" y="178.5" text-anchor="middle" class="small">SQLite claim graph</text>
  <rect x="624" y="212" width="180" height="54" rx="4" class="node"/>
  <text x="714.0" y="233.5" text-anchor="middle" class="">Kernel</text>
  <text x="714.0" y="254.5" text-anchor="middle" class="small">verifies one claim</text>
  <rect x="824" y="212" width="180" height="54" rx="4" class="node"/>
  <text x="914.0" y="233.5" text-anchor="middle" class="">ArtifactStore</text>
  <text x="914.0" y="254.5" text-anchor="middle" class="small">content-addressed JSON</text>
  <path d="M540 87h84" class="flow"/>
  <text x="582" y="80.0" text-anchor="middle" class="label">ingest</text>
  <path d="M714 114v22" class="flow"/>
  <path d="M804 87h20" class="flow"/>
  <path d="M804 163h20" class="flow"/>
  <path d="M714 190v22" class="flow"/>
  <path d="M804 239h20" class="flow"/>
  <path d="M914 190v22" class="plain"/>
  <text x="940" y="205.0" text-anchor="middle" class="label">read/write</text>
  <rect x="16" y="316" width="1008" height="300" rx="5" class="group"/>
  <path d="M16 346h1008" class="plain"/>
  <text x="520.0" y="336.0" text-anchor="middle" class="heading">Inside the kernel: one claim at a time</text>
  <rect x="36" y="360" width="200" height="60" rx="4" class="node"/>
  <text x="136.0" y="384.5" text-anchor="middle" class="">Compiler role</text>
  <text x="136.0" y="405.5" text-anchor="middle" class="small">obligations from the claim</text>
  <rect x="256" y="360" width="200" height="60" rx="4" class="node"/>
  <text x="356.0" y="384.5" text-anchor="middle" class="">Critic role</text>
  <text x="356.0" y="405.5" text-anchor="middle" class="small">attacks the decomposition</text>
  <path d="M236 390h20" class="flow"/>
  <path d="M356 420v20" class="flow"/>
  <text x="356" y="457.0" text-anchor="middle" class="label">reviewed contract</text>
  <rect x="36" y="470" width="200" height="60" rx="4" class="node"/>
  <text x="136.0" y="494.5" text-anchor="middle" class="">Obligation nodes</text>
  <text x="136.0" y="515.5" text-anchor="middle" class="small">shared, content-addressed</text>
  <path d="M136 420v50" class="flow"/>
  <rect x="476" y="350" width="528" height="250" rx="5" class="group optional"/>
  <path d="M476 380h528" class="plain"/>
  <text x="740.0" y="370.0" text-anchor="middle" class="heading">Binding game, per obligation</text>
  <rect x="496" y="400" width="150" height="60" rx="4" class="node"/>
  <text x="571.0" y="424.5" text-anchor="middle" class="">Oracle role</text>
  <text x="571.0" y="445.5" text-anchor="middle" class="small">proposes methods</text>
  <rect x="666" y="400" width="150" height="60" rx="4" class="node"/>
  <text x="741.0" y="424.5" text-anchor="middle" class="">Executor role</text>
  <text x="741.0" y="445.5" text-anchor="middle" class="small">runs one method</text>
  <rect x="836" y="400" width="150" height="60" rx="4" class="node"/>
  <text x="911.0" y="424.5" text-anchor="middle" class="">Judger role</text>
  <text x="911.0" y="445.5" text-anchor="middle" class="small">audits the result</text>
  <path d="M646 430h20" class="flow"/>
  <path d="M816 430h20" class="flow"/>
  <path d="M911 460v40H741v-40" class="flow"/>
  <text x="826" y="517.0" text-anchor="middle" class="label">redo (≤3)</text>
  <rect x="496" y="500" width="150" height="60" rx="4" class="node"/>
  <text x="571.0" y="524.5" text-anchor="middle" class="">Kernel gates</text>
  <text x="571.0" y="545.5" text-anchor="middle" class="small">mechanical checks</text>
  <path d="M646 530h20v-70" class="plain"/>
  <text x="741" y="587.0" text-anchor="middle" class="small">Every settled obligation records outcome, basis, strength, witness, and artifact digest</text>
  <path d="M236 500h240" class="flow"/>
  <text x="356" y="493.0" text-anchor="middle" class="label">discharge</text>
  <text x="520" y="633.0" text-anchor="middle" class="small">Model backend for every role: Claude Agent SDK (default) or the Codex CLI. Roles are stateless; one session per call.</text>
</svg>
