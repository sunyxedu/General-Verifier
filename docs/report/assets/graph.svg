<svg xmlns="http://www.w3.org/2000/svg" id="graph-diagram" width="1000" height="470" viewBox="0 0 1000 470" role="group" aria-labelledby="graph-title graph-desc" lang="en">
  <title id="graph-title">The claim graph of the sum example</title>
  <desc id="graph-desc">Three claims: a tool-result effect, an assertion about what the recorded command wrote, and a final claim about the delivered file. Solid arrows point from a claim to the claim it depends on. Dashed arrows point from a claim to its obligation nodes. The final claim&#x27;s obligations come from the task statement, not from the assertion it depends on.</desc>
  <defs>
    <marker id="graph-diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39434d"/></marker>
    <style>
      #graph-diagram text { font-family: Arial, Helvetica, sans-serif; fill: #202830; font-size: 15px; }
      #graph-diagram .heading { font-size: 16px; font-weight: 700; }
      #graph-diagram .small { font-size: 13px; fill: #46515c; }
      #graph-diagram .mono { font-family: "Roboto Mono", Menlo, Consolas, monospace; font-size: 13px; }
      #graph-diagram .label { font-size: 13px; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
      #graph-diagram .node { fill: white; stroke: #59636d; stroke-width: 1.2; }
      #graph-diagram .shade { fill: #f3f5f7; stroke: #59636d; stroke-width: 1.2; }
      #graph-diagram .group { fill: white; stroke: #a3aab1; stroke-width: 1; }
      #graph-diagram .optional { stroke-dasharray: 5 4; }
      #graph-diagram .flow { fill: none; stroke: #39434d; stroke-width: 1.4; marker-end: url(#graph-diagram-arrow); }
      #graph-diagram .dep { fill: none; stroke: #39434d; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#graph-diagram-arrow); }
      #graph-diagram .plain { fill: none; stroke: #a3aab1; stroke-width: 1; }
      #graph-diagram a:hover .node, #graph-diagram a:focus .node { fill: #eef4fa; stroke: #245f9e; stroke-width: 2; }
      #graph-diagram a { cursor: pointer; }
      #graph-diagram a:focus { outline: none; }
    </style>
  </defs>
  <rect width="1000" height="470" fill="white"/>
  <rect x="20" y="40" width="280" height="112" rx="4" class="shade"/>
  <text x="160.0" y="71.0" text-anchor="middle" class="mono">effect:2</text>
  <text x="160.0" y="91.0" text-anchor="middle" class="">Tool result recorded at seq 2</text>
  <text x="160.0" y="111.0" text-anchor="middle" class="small">kind: effect</text>
  <text x="160.0" y="131.0" text-anchor="middle" class="small">checked by ledger digest</text>
  <rect x="360" y="40" width="280" height="112" rx="4" class="node"/>
  <text x="500.0" y="61.0" text-anchor="middle" class="mono">C1</text>
  <text x="500.0" y="81.0" text-anchor="middle" class="">As of effect:2, the command wrote</text>
  <text x="500.0" y="101.0" text-anchor="middle" class="">the sum of 1..5 and a newline</text>
  <text x="500.0" y="121.0" text-anchor="middle" class="">to /app/answer.txt</text>
  <text x="500.0" y="141.0" text-anchor="middle" class="small">kind: assertion · deps: effect:2</text>
  <rect x="700" y="40" width="280" height="112" rx="4" class="node"/>
  <text x="840.0" y="61.0" text-anchor="middle" class="mono">F</text>
  <text x="840.0" y="81.0" text-anchor="middle" class="">/app/answer.txt contains 15</text>
  <text x="840.0" y="101.0" text-anchor="middle" class="">followed by a newline</text>
  <text x="840.0" y="121.0" text-anchor="middle" class="small">kind: final · deps: C1</text>
  <text x="840.0" y="141.0" text-anchor="middle" class="small">contract compiled from task.md</text>
  <path d="M360 96h-60" class="flow"/>
  <text x="330" y="89.0" text-anchor="middle" class="label">depends on</text>
  <path d="M700 96h-60" class="flow"/>
  <text x="670" y="89.0" text-anchor="middle" class="label">depends on</text>
  <rect x="360" y="210" width="280" height="96" rx="4" class="node"/>
  <text x="500.0" y="243.0" text-anchor="middle" class="">The record at seq 1–2 shows the</text>
  <text x="500.0" y="263.0" text-anchor="middle" class="">write command and exit code 0</text>
  <text x="500.0" y="283.0" text-anchor="middle" class="small">basis: record · severity: must</text>
  <path d="M500 152v58" class="dep"/>
  <rect x="700" y="210" width="280" height="96" rx="4" class="node"/>
  <text x="840.0" y="243.0" text-anchor="middle" class="">/app/answer.txt holds the sum of</text>
  <text x="840.0" y="263.0" text-anchor="middle" class="">the integers 1 through 5 (15)</text>
  <text x="840.0" y="283.0" text-anchor="middle" class="small">basis: world · severity: must</text>
  <rect x="700" y="330" width="280" height="96" rx="4" class="node"/>
  <text x="840.0" y="363.0" text-anchor="middle" class="">/app/answer.txt is a base-10 integer</text>
  <text x="840.0" y="383.0" text-anchor="middle" class="">followed by one newline</text>
  <text x="840.0" y="403.0" text-anchor="middle" class="small">basis: world · severity: must</text>
  <path d="M840 152v58" class="dep"/>
  <path d="M840 306v24" class="dep"/>
  <text x="500" y="336.0" text-anchor="middle" class="small">Obligation nodes are graph nodes too.</text>
  <text x="500" y="355.0" text-anchor="middle" class="small">The same condition compiled under another</text>
  <text x="500" y="374.0" text-anchor="middle" class="small">claim is the same node and reuses its verdict.</text>
  <text x="160" y="225.5" text-anchor="middle" class="small">Effects are lazy: the ledger check runs</text>
  <text x="160" y="244.5" text-anchor="middle" class="small">only when a claim depends on the event.</text>
  <text x="20" y="445.0" text-anchor="start" class="small">Illustrative decomposition. A model run may word the checks differently; what matters is that the final contract covers the task.</text>
  <text x="20" y="467.0" text-anchor="start" class="small">Solid arrow: depends on.  Dashed arrow: obligation of.  Shaded: mechanical, no model call.</text>
</svg>
