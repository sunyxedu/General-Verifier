<svg xmlns="http://www.w3.org/2000/svg" id="contract-diagram" width="920" height="648" viewBox="0 0 920 648" role="group" aria-labelledby="contract-title contract-desc" lang="en">
  <title id="contract-title">Review the final task contract before execution</title>
  <desc id="contract-desc">The Compiler derives checks from the original task and final claim without assuming intermediate claims. The Critic reviews the complete contract. An accepted contract proceeds to execution. Otherwise the Compiler may repair it within budget and the Critic reviews again. Exhausting review or repair leaves the final unverified.</desc>
  <defs>
    <marker id="contract-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39434d"/></marker>
    <style>
      #contract-diagram text { font-family: Arial, Helvetica, sans-serif; fill: #202830; font-size: 16px; }
      #contract-diagram .heading { font-size: 18px; font-weight: 700; }
      #contract-diagram .small { font-size: 14px; fill: #46515c; }
      #contract-diagram .label { font-size: 14px; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
      #contract-diagram .node { fill: white; stroke: #59636d; stroke-width: 1.2; }
      #contract-diagram .group { fill: white; stroke: #a3aab1; stroke-width: 1; }
      #contract-diagram .optional { stroke-dasharray: 5 4; }
      #contract-diagram .flow { fill: none; stroke: #39434d; stroke-width: 1.4; marker-end: url(#contract-arrow); }
      #contract-diagram a:hover .node, #contract-diagram a:focus .node { fill: #eef4fa; stroke: #245f9e; stroke-width: 2; }
      #contract-diagram a { cursor: pointer; }
      #contract-diagram a:focus { outline: none; }
    </style>
  </defs>
  <rect width="920" height="648" fill="white"/>
  <rect x="72" y="22" width="360" height="58" rx="29" class="node"/>
  <text x="252.0" y="45.5" text-anchor="middle" class="">Original task + final claim</text>
  <text x="252.0" y="66.5" text-anchor="middle" class="">No assumed intermediate claims</text>
  <path d="M252 80 V118" class="flow"/>
  <rect x="72" y="118" width="360" height="58" rx="4" class="node"/>
  <text x="252.0" y="141.5" text-anchor="middle" class="">Compiler: propose the checks</text>
  <text x="252.0" y="162.5" text-anchor="middle" class="">Value matches 15; required file format</text>
  <path d="M252 176 V214" class="flow"/>
  <rect x="72" y="214" width="360" height="58" rx="4" class="node"/>
  <text x="252.0" y="237.5" text-anchor="middle" class="">Critic: review the whole contract</text>
  <text x="252.0" y="258.5" text-anchor="middle" class="">Missing requirements? Extra restrictions?</text>
  <path d="M252 272 V310" class="flow"/>
  <path d="M252.0 310 L382 371.0 L252.0 432 L122 371.0 Z" class="node"/>
  <text x="252.0" y="365.5" text-anchor="middle" class="">Contract</text>
  <text x="252.0" y="386.5" text-anchor="middle" class="">accepted?</text>
  <path d="M252 432 V526" class="flow"/>
  <text x="278" y="475" text-anchor="middle" class="label">Yes</text>
  <rect x="72" y="526" width="360" height="64" rx="4" class="node"/>
  <text x="252.0" y="552.5" text-anchor="middle" class="">Use the reviewed obligations</text>
  <text x="252.0" y="573.5" text-anchor="middle" class="">Proceed to evidence collection</text>
  <path d="M382 371 H590" class="flow"/>
  <text x="481" y="357" text-anchor="middle" class="label">No</text>
  <path d="M720.0 310 L850 371.0 L720.0 432 L590 371.0 Z" class="node"/>
  <text x="720.0" y="365.5" text-anchor="middle" class="">Repair budget</text>
  <text x="720.0" y="386.5" text-anchor="middle" class="">remaining?</text>
  <path d="M720 310 V266" class="flow"/>
  <text x="746" y="292" text-anchor="middle" class="label">Yes</text>
  <rect x="540" y="184" width="360" height="82" rx="4" class="node"/>
  <text x="720.0" y="209.0" text-anchor="middle" class="">Compiler: repair the checks</text>
  <text x="720.0" y="230.0" text-anchor="middle" class="">using the review feedback</text>
  <text x="720.0" y="251.0" text-anchor="middle" class="">The repaired contract must be reviewed</text>
  <path d="M720 184 V154 H472 V243 H432" class="flow"/>
  <path d="M720 432 V526" class="flow"/>
  <text x="746" y="475" text-anchor="middle" class="label">No</text>
  <rect x="540" y="526" width="360" height="64" rx="4" class="node"/>
  <text x="720.0" y="552.5" text-anchor="middle" class="">Keep the final unverified</text>
  <text x="720.0" y="573.5" text-anchor="middle" class="">No accepted task contract</text>
  <text x="24" y="628" text-anchor="start" class="small">Default: at most 4 Critic reviews and 3 repair calls. An unreviewed repair is never accepted.</text>
</svg>
