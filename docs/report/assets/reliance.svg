<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img" aria-labelledby="title desc">
  <title id="title">同一个求和例子里的两条检查路径</title>
  <desc id="desc">中间论证假定输入恰好是 1 到 5，可以局部证明这些数的和是 15，但输入前提尚未建立，所以有效状态仍是未验证。最终路径则从原任务独立求和、读取捕获文件并核对格式；这组检查决定最终判定。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#84929f"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#273444}
      .label{font-size:15px;fill:#536373}
      .name{font-size:20px;font-weight:600}
      .body{font-size:17px;fill:#536373}
      .state{font-size:16px;fill:#476b93}
      .box{fill:#f7f9fb;stroke:#d7e0e7;rx:8}
      .arrow{stroke:#84929f;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="452" fill="#fff"/>
  <text x="20" y="29" class="label">中间论证：每个结论保留它成立所需的前提</text>
  <rect x="20" y="49" width="282" height="123" class="box"/>
  <text x="40" y="84" class="name">P：输入恰好是 1 到 5</text>
  <text x="40" y="118" class="body">这是代理的中间声明</text>
  <text x="40" y="147" class="state">前提尚未建立</text>
  <path d="M303 112H350" class="arrow" stroke-dasharray="4 4"/>
  <rect x="360" y="49" width="282" height="123" class="box"/>
  <text x="380" y="84" class="name">Q：这些数的和为 15</text>
  <text x="380" y="118" class="body">假定 P 后检查 Q</text>
  <text x="380" y="147" class="state">局部：verified</text>
  <path d="M643 112H688" class="arrow"/>
  <rect x="698" y="49" width="282" height="123" rx="8" fill="#fff8e9" stroke="#dbc492"/>
  <text x="718" y="84" class="name">这条论证仍有缺口</text>
  <text x="718" y="118" class="body">还需要建立前提 P</text>
  <text x="718" y="147" class="state">有效：unverified</text>
  <path d="M20 209H980" stroke="#e2e7ed"/>
  <text x="20" y="245" class="label">最终交付：从原任务建立完整的成功条件，不假定中间结论</text>
  <rect x="20" y="265" width="282" height="123" class="box"/>
  <text x="40" y="300" class="name">原任务</text>
  <text x="40" y="334" class="body">求和 1 到 5，写入指定文件</text>
  <text x="40" y="363" class="body">保留整数与换行格式</text>
  <path d="M303 328H350" class="arrow"/>
  <rect x="360" y="265" width="282" height="123" class="box"/>
  <text x="380" y="300" class="name">独立检查交付物</text>
  <text x="380" y="334" class="body">重算得到 15，读取捕获文件</text>
  <text x="380" y="363" class="body">比较数值，并检查格式</text>
  <path d="M643 328H688" class="arrow"/>
  <rect x="698" y="265" width="282" height="123" rx="8" fill="#eef5fc" stroke="#9cb5cf"/>
  <text x="718" y="300" class="name">最终判定</text>
  <text x="718" y="334" class="body">由这组任务检查决定</text>
  <text x="718" y="363" class="body">中间论证另行保留供审查</text>
  <text x="20" y="430" class="label">图中展示状态关系，不代表一次实际模型评测。</text>
</svg>
