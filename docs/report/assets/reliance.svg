<svg xmlns="http://www.w3.org/2000/svg" id="reliance-diagram" width="1000" height="494" viewBox="0 0 1000 494" role="group" aria-labelledby="reliance-title reliance-desc" lang="en">
  <title id="reliance-title">Conditional reasoning and an independent final check</title>
  <desc id="reliance-desc">In the first lane the agent assumes that the inputs are exactly 1 through 5, locally verifies that their sum is 15, but remains effectively unverified until the input premise is established. In the second lane the final checks independently use the original task and captured file. Only these final checks determine the final verdict.</desc>
  <defs>
    <marker id="reliance-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39434d"/></marker>
    <style>
      #reliance-diagram text { font-family: Arial, Helvetica, sans-serif; fill: #202830; font-size: 16px; }
      #reliance-diagram .heading { font-size: 18px; font-weight: 700; }
      #reliance-diagram .small { font-size: 14px; fill: #46515c; }
      #reliance-diagram .label { font-size: 14px; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
      #reliance-diagram .node { fill: white; stroke: #59636d; stroke-width: 1.2; }
      #reliance-diagram .group { fill: white; stroke: #a3aab1; stroke-width: 1; }
      #reliance-diagram .optional { stroke-dasharray: 5 4; }
      #reliance-diagram .flow { fill: none; stroke: #39434d; stroke-width: 1.4; marker-end: url(#reliance-arrow); }
      #reliance-diagram a:hover .node, #reliance-diagram a:focus .node { fill: #eef4fa; stroke: #245f9e; stroke-width: 2; }
      #reliance-diagram a { cursor: pointer; }
      #reliance-diagram a:focus { outline: none; }
    </style>
  </defs>
  <rect width="1000" height="494" fill="white"/>
  <rect x="16" y="16" width="968" height="190" rx="5" class="group"/>
  <path d="M16 58 H984" stroke="#a3aab1"/>
  <text x="500.0" y="43" text-anchor="middle" class="heading">Intermediate reasoning: retain every assumed premise</text>
  <rect x="38" y="88" width="270" height="78" rx="4" class="node"/>
  <text x="173.0" y="121.5" text-anchor="middle" class="">P: inputs are exactly 1–5</text>
  <text x="173.0" y="142.5" text-anchor="middle" class="">Premise not yet established</text>
  <path d="M308 127 H362" class="flow"/>
  <rect x="362" y="88" width="270" height="78" rx="4" class="node"/>
  <text x="497.0" y="111.0" text-anchor="middle" class="">Q: their sum is 15</text>
  <text x="497.0" y="132.0" text-anchor="middle" class="">Assume P for this check</text>
  <text x="497.0" y="153.0" text-anchor="middle" class="">Local state: verified</text>
  <path d="M632 127 H686" class="flow"/>
  <rect x="686" y="88" width="276" height="78" rx="4" class="node"/>
  <text x="824.0" y="121.5" text-anchor="middle" class="">P is still unresolved</text>
  <text x="824.0" y="142.5" text-anchor="middle" class="">Effective state: unverified</text>
  <rect x="16" y="242" width="968" height="190" rx="5" class="group"/>
  <path d="M16 284 H984" stroke="#a3aab1"/>
  <text x="500.0" y="269" text-anchor="middle" class="heading">Final deliverable: check the original task without assumed intermediate claims</text>
  <rect x="38" y="314" width="270" height="78" rx="4" class="node"/>
  <text x="173.0" y="347.5" text-anchor="middle" class="">Task: sum 1–5; write the file</text>
  <text x="173.0" y="368.5" text-anchor="middle" class="">Use an integer and a newline</text>
  <path d="M308 353 H362" class="flow"/>
  <rect x="362" y="314" width="270" height="78" rx="4" class="node"/>
  <text x="497.0" y="347.5" text-anchor="middle" class="">Recompute; read captured file</text>
  <text x="497.0" y="368.5" text-anchor="middle" class="">Compare value and format</text>
  <path d="M632 353 H686" class="flow"/>
  <rect x="686" y="314" width="276" height="78" rx="4" class="node"/>
  <text x="824.0" y="347.5" text-anchor="middle" class="">Determine the final verdict</text>
  <text x="824.0" y="368.5" text-anchor="middle" class="">from these task checks</text>
  <text x="20" y="471" text-anchor="start" class="small">An open intermediate premise does not replace a final task check. This is an illustrative state relationship.</text>
</svg>
