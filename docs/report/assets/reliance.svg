<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Two verification paths through the sum example</title>
  <desc id="desc">An intermediate argument assumes the inputs are exactly 1 through 5 and locally verifies that their sum is 15. Its effective state remains unverified until the premise is established. The final path independently computes the sum from the task, reads the captured file, and checks its format. These final checks determine the verdict.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#84929f"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#273444}
      .label{font-size:15px;fill:#536373}
      .name{font-size:18px;font-weight:600}
      .body{font-size:16px;fill:#536373}
      .state{font-size:16px;fill:#476b93}
      .box{fill:#f7f9fb;stroke:#d7e0e7;rx:8}
      .arrow{stroke:#84929f;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="452" fill="#fff"/>
  <text x="20" y="29" class="label">Intermediate reasoning: each conclusion retains the premises it depends on.</text>
  <rect x="20" y="49" width="282" height="123" class="box"/>
  <text x="40" y="84" class="name">P: Inputs are exactly 1–5</text>
  <text x="40" y="118" class="body">An intermediate agent claim</text>
  <text x="40" y="147" class="state">Premise not yet established</text>
  <path d="M303 112H350" class="arrow" stroke-dasharray="4 4"/>
  <rect x="360" y="49" width="282" height="123" class="box"/>
  <text x="380" y="84" class="name">Q: Their sum is 15</text>
  <text x="380" y="118" class="body">Check Q while assuming P</text>
  <text x="380" y="147" class="state">Local: verified</text>
  <path d="M643 112H688" class="arrow"/>
  <rect x="698" y="49" width="282" height="123" rx="8" fill="#fff8e9" stroke="#dbc492"/>
  <text x="718" y="84" class="name">An unresolved premise</text>
  <text x="718" y="118" class="body">P still needs to be established</text>
  <text x="718" y="147" class="state">Effective: unverified</text>
  <path d="M20 209H980" stroke="#e2e7ed"/>
  <text x="20" y="245" class="label">Final deliverable: derive the full success conditions from the task, with no assumed intermediate claims.</text>
  <rect x="20" y="265" width="282" height="123" class="box"/>
  <text x="40" y="300" class="name">Original task</text>
  <text x="40" y="334" class="body">Sum 1–5; write the file</text>
  <text x="40" y="363" class="body">Use an integer and a newline</text>
  <path d="M303 328H350" class="arrow"/>
  <rect x="360" y="265" width="282" height="123" class="box"/>
  <text x="380" y="300" class="name">Independent checks</text>
  <text x="380" y="334" class="body">Recompute; read captured file</text>
  <text x="380" y="363" class="body">Compare value; check format</text>
  <path d="M643 328H688" class="arrow"/>
  <rect x="698" y="265" width="282" height="123" rx="8" fill="#eef5fc" stroke="#9cb5cf"/>
  <text x="718" y="300" class="name">Final verdict</text>
  <text x="718" y="334" class="body">Determined by the task checks</text>
  <text x="718" y="363" class="body">Intermediate reasoning kept</text>
  <text x="20" y="430" class="label">This diagram illustrates state relationships, not a measured model evaluation.</text>
</svg>
