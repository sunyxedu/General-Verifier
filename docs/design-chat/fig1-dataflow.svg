<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5B6272"/>
    </marker>
    <marker id="arm" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9AA2B0"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- solver -->
  <rect x="30" y="22" width="900" height="60" rx="10" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1.3"/>
  <text x="50" y="48" font-size="13" font-weight="bold" fill="#14161C">SOLVER — a stock Claude Code session (unmodified)</text>
  <text x="50" y="66" font-size="10.5" fill="#4A5160">every tool call is recorded by hooks; every conclusion is volunteered as a claim over MCP — gv.commit blocks until the verdict comes back</text>

  <!-- two channels -->
  <path d="M 140 82 L 140 186" fill="none" stroke="#5B6272" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="152" y="118" font-size="9.5" fill="#4A5160">Pre/PostToolUse hooks:</text>
  <text x="152" y="131" font-size="9.5" fill="#4A5160">raw JSONL, concurrent writers</text>

  <path d="M 390 82 L 390 186" fill="none" stroke="#5B6272" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="402" y="112" font-size="9.5" fill="#4A5160">MCP verbs (stdio, blocking):</text>
  <text x="402" y="125" font-size="9.5" fill="#4A5160">gv.commit · gv.verify ·</text>
  <text x="402" y="138" font-size="9.5" fill="#4A5160">gv.certificate · gv.status</text>

  <!-- verifier panel -->
  <rect x="30" y="148" width="900" height="262" rx="13" fill="#F6F7F9" stroke="#E1E5EC" stroke-width="1.2"/>
  <text x="48" y="170" font-size="9.5" font-weight="bold" fill="#7C838F" letter-spacing="2">VERIFIER · ONE SEPARATE PROCESS (THE MCP SERVER)</text>

  <!-- row 1: ingest -->
  <rect x="50" y="186" width="180" height="62" rx="9" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1.15"/>
  <text x="64" y="206" font-size="11" font-weight="bold" fill="#14161C">HOOK FEED</text>
  <text x="64" y="221" font-size="9.5" fill="#4A5160" font-family="Menlo, monospace">hook_feed.jsonl</text>
  <text x="64" y="235" font-size="9" fill="#8B92A1">no seq discipline — untrusted</text>

  <path d="M 230 217 L 278 217" fill="none" stroke="#5B6272" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="254" y="210" font-size="8.5" fill="#8B92A1" text-anchor="middle">drain</text>

  <rect x="280" y="186" width="215" height="62" rx="9" fill="#FFFFFF" stroke="#5B6272" stroke-width="1.6"/>
  <text x="294" y="206" font-size="11" font-weight="bold" fill="#14161C">EVENT LOG</text>
  <text x="294" y="221" font-size="9.5" fill="#4A5160" font-family="Menlo, monospace">events.jsonl · append-only</text>
  <text x="294" y="235" font-size="9" fill="#8B92A1">seq-validated · the only input, the only audit trail</text>

  <path d="M 495 217 L 543 217" fill="none" stroke="#5B6272" stroke-width="1.3" marker-end="url(#ar)"/>

  <rect x="545" y="186" width="165" height="62" rx="9" fill="#EAF1FA" stroke="#4A82C4" stroke-width="1.35"/>
  <text x="559" y="206" font-size="11" font-weight="bold" fill="#14161C">BUILDER</text>
  <text x="559" y="221" font-size="9.5" fill="#4A5160">events → claims</text>
  <text x="559" y="235" font-size="9" fill="#8B92A1">deterministic, zero LLM</text>

  <path d="M 710 217 L 738 217" fill="none" stroke="#5B6272" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- claim graph (spans two rows) -->
  <rect x="740" y="186" width="170" height="204" rx="10" fill="#FFFFFF" stroke="#9AA8BC" stroke-width="1.5"/>
  <text x="754" y="207" font-size="11" font-weight="bold" fill="#14161C">CLAIM GRAPH</text>
  <text x="754" y="222" font-size="9" fill="#8B92A1" font-family="Menlo, monospace">claims.sqlite</text>
  <text x="754" y="242" font-size="9.5" fill="#4A5160">· claims DAG w/ status</text>
  <text x="754" y="257" font-size="9.5" fill="#4A5160">· obligation nodes,</text>
  <text x="762" y="270" font-size="9.5" fill="#4A5160">content-addressed</text>
  <text x="754" y="285" font-size="9.5" fill="#4A5160">· evidence per node</text>
  <text x="754" y="300" font-size="9.5" fill="#4A5160">· status machine</text>
  <text x="754" y="320" font-size="9" fill="#8B92A1">the single trigger rule:</text>
  <text x="754" y="333" font-size="9" fill="#8B92A1">verify at COMMIT; effects</text>
  <text x="754" y="346" font-size="9" fill="#8B92A1">lazy until leaned on;</text>
  <text x="754" y="359" font-size="9" fill="#8B92A1">first-dependent retries;</text>
  <text x="754" y="372" font-size="9" fill="#8B92A1">certificate = backstop</text>

  <!-- row 2: kernel + artifacts -->
  <rect x="50" y="286" width="420" height="104" rx="10" fill="#EAF1FA" stroke="#4A82C4" stroke-width="1.35"/>
  <text x="64" y="307" font-size="11" font-weight="bold" fill="#14161C">KERNEL — verifies one claim at a time</text>
  <text x="64" y="324" font-size="9.5" fill="#4A5160">taint gate → compile obligations → discharge each node → settle (fold)</text>
  <rect x="64" y="336" width="392" height="42" rx="7" fill="#FDF2E7" stroke="#E08A45" stroke-width="1.2"/>
  <text x="76" y="353" font-size="9.5" font-weight="bold" fill="#14161C">BINDING GAME (per obligation, LLM seats)</text>
  <text x="76" y="368" font-size="9" fill="#4A5160">oracle → executor → judger · redo ≤ 3, blind re-judge · fail-closed</text>

  <rect x="510" y="286" width="200" height="104" rx="10" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1.15"/>
  <text x="524" y="307" font-size="11" font-weight="bold" fill="#14161C">ARTIFACT STORE</text>
  <text x="524" y="324" font-size="9.5" fill="#4A5160">content-addressed JSON:</text>
  <text x="524" y="339" font-size="9.5" fill="#4A5160">workdir snapshots, game</text>
  <text x="524" y="354" font-size="9.5" fill="#4A5160">records, certificates</text>
  <text x="524" y="374" font-size="9" fill="#8B92A1">evidence points here by digest</text>

  <!-- kernel <-> graph -->
  <path d="M 740 310 L 472 310" fill="none" stroke="#5B6272" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="605" y="303" font-size="8.5" fill="#8B92A1" text-anchor="middle">trigger: a claim was committed</text>
  <path d="M 472 336 L 740 336" fill="none" stroke="#5B6272" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="605" y="350" font-size="8.5" fill="#8B92A1" text-anchor="middle">obligation nodes · verdicts · evidence</text>

  <!-- kernel writes its own events -->
  <path d="M 160 286 L 160 262 L 340 262 L 340 250" fill="none" stroke="#9AA2B0" stroke-width="1.15" stroke-dasharray="4 2.6" marker-end="url(#arm)"/>
  <text x="168" y="270" font-size="8.5" fill="#8B92A1">the kernel appends its own events too — auditable through its own ledger</text>

  <!-- row 3: certificate / consumer -->
  <path d="M 825 390 L 825 414 L 320 414 L 320 438" fill="none" stroke="#5B6272" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="580" y="428" font-size="8.5" fill="#8B92A1" text-anchor="middle">backward slice of the final claim, residue settled, then frozen</text>

  <rect x="30" y="440" width="580" height="66" rx="10" fill="#EAF1FA" stroke="#4A82C4" stroke-width="1.4"/>
  <text x="50" y="463" font-size="12" font-weight="bold" fill="#14161C">CERTIFICATE — the final's slice with nested obligations + evidence</text>
  <text x="50" y="481" font-size="9.5" fill="#4A5160">verdict = worst case over the slice: refuted &gt; unverified &gt; partial &gt; verified — never rounds up</text>
  <text x="50" y="496" font-size="9" fill="#8B92A1">returned to the solver over MCP; also frozen into the artifact store</text>

  <path d="M 610 472 L 668 472" fill="none" stroke="#5B6272" stroke-width="1.3" marker-end="url(#ar)"/>

  <rect x="670" y="440" width="260" height="66" rx="10" fill="#FFFFFF" stroke="#C3C9D4" stroke-width="1.25"/>
  <text x="688" y="463" font-size="12" font-weight="bold" fill="#14161C">CONSUMER / CI</text>
  <text x="688" y="481" font-size="9.5" fill="#4A5160" font-family="Menlo, monospace">verifier.cli certify → exit 0 iff verified</text>
  <text x="688" y="496" font-size="9" fill="#8B92A1">enforcement inverted: the consumer refuses, the solver is never forced</text>

  <text x="480" y="540" font-size="9.5" fill="#8B92A1" text-anchor="middle" font-style="italic">offline mode is not a second mode: it is the same event file replayed through the same builder into the same kernel</text>
</svg>
