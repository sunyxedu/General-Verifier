<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5B6272"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#FFFFFF"/>
  <text x="30" y="28" font-size="9.5" font-weight="bold" fill="#7C838F" letter-spacing="2">THE TRUST BOUNDARY — "LLM GENERATION AFFECTS EFFICIENCY ONLY, NEVER CORRECTNESS"</text>

  <!-- left column: LLM seats -->
  <rect x="30" y="44" width="430" height="330" rx="12" fill="#FDF2E7" stroke="#E08A45" stroke-width="1.4"/>
  <text x="50" y="68" font-size="12" font-weight="bold" fill="#C96A1E">LLM SEATS — propose (efficiency only)</text>
  <text x="50" y="84" font-size="9" fill="#8B92A1">the tool palette IS the capability boundary (tools=, not allowed_tools)</text>

  <rect x="48" y="96" width="394" height="60" rx="8" fill="#FFFFFF" stroke="#E08A45" stroke-width="1.1"/>
  <text x="62" y="115" font-size="10.5" font-weight="bold" fill="#14161C">obligation compiler</text>
  <text x="62" y="130" font-size="9.5" fill="#4A5160" font-family="Menlo, monospace">Read · Grep · Glob</text>
  <text x="62" y="145" font-size="9" fill="#8B92A1">cannot execute anything — that inability is what makes it answer-blind</text>

  <rect x="48" y="164" width="394" height="60" rx="8" fill="#FFFFFF" stroke="#E08A45" stroke-width="1.1"/>
  <text x="62" y="183" font-size="10.5" font-weight="bold" fill="#14161C">oracle enumerator</text>
  <text x="62" y="198" font-size="9.5" fill="#4A5160" font-family="Menlo, monospace">Read · Grep · Glob · WebSearch · WebFetch</text>
  <text x="62" y="213" font-size="9" fill="#8B92A1">may research the domain; no Bash — it must not probe what is installed</text>

  <rect x="48" y="232" width="394" height="60" rx="8" fill="#FFFFFF" stroke="#E08A45" stroke-width="1.1"/>
  <text x="62" y="251" font-size="10.5" font-weight="bold" fill="#14161C">discharge executor</text>
  <text x="62" y="266" font-size="9.5" fill="#4A5160" font-family="Menlo, monospace">Bash · Read · Write · Grep</text>
  <text x="62" y="281" font-size="9" fill="#8B92A1">the only hands; installs instruments; its workdir is snapshotted as evidence</text>

  <rect x="48" y="300" width="394" height="60" rx="8" fill="#FFFFFF" stroke="#E08A45" stroke-width="1.1"/>
  <text x="62" y="319" font-size="10.5" font-weight="bold" fill="#14161C">judger</text>
  <text x="62" y="334" font-size="9.5" fill="#4A5160" font-family="Menlo, monospace">Read · Bash · Grep</text>
  <text x="62" y="349" font-size="9" fill="#8B92A1">can rerun the check to test reproducibility; judges fidelity, not truth</text>

  <!-- middle arrow -->
  <path d="M 462 208 L 528 208" fill="none" stroke="#5B6272" stroke-width="2" marker-end="url(#ar)"/>
  <text x="495" y="196" font-size="8.5" fill="#4A5160" text-anchor="middle">every proposal</text>
  <text x="495" y="226" font-size="8.5" fill="#4A5160" text-anchor="middle">passes a gate</text>

  <!-- right column: mechanical gates -->
  <rect x="530" y="44" width="400" height="330" rx="12" fill="#EAF1FA" stroke="#4A82C4" stroke-width="1.4"/>
  <text x="550" y="68" font-size="12" font-weight="bold" fill="#2E5F9E">MECHANICAL GATES — decide (correctness)</text>
  <text x="550" y="84" font-size="9" fill="#8B92A1">a gate never asks a model for its opinion</text>

  <rect x="548" y="96" width="364" height="48" rx="8" fill="#FFFFFF" stroke="#4A82C4" stroke-width="1.1"/>
  <text x="562" y="114" font-size="10" font-weight="bold" fill="#14161C">schema gate</text>
  <text x="562" y="129" font-size="9" fill="#4A5160">validate() + one retry; still malformed → RoleError = FAILED, never a pass</text>

  <rect x="548" y="152" width="364" height="48" rx="8" fill="#FFFFFF" stroke="#4A82C4" stroke-width="1.1"/>
  <text x="562" y="170" font-size="10" font-weight="bold" fill="#14161C">python sandbox check_spec</text>
  <text x="562" y="185" font-size="9" fill="#4A5160">last stdout line must be {"holds": bool}; crash / timeout / garbage = FAILED</text>

  <rect x="548" y="208" width="364" height="48" rx="8" fill="#FFFFFF" stroke="#4A82C4" stroke-width="1.1"/>
  <text x="562" y="226" font-size="10" font-weight="bold" fill="#14161C">ledger digest check</text>
  <text x="562" y="241" font-size="9" fill="#4A5160">effect claims re-hash the recorded event — the record, not the narration</text>

  <rect x="548" y="264" width="364" height="48" rx="8" fill="#FFFFFF" stroke="#4A82C4" stroke-width="1.1"/>
  <text x="562" y="282" font-size="10" font-weight="bold" fill="#14161C">status machine + settle fold + certificate fold</text>
  <text x="562" y="297" font-size="9" fill="#4A5160">legal transitions only; worst-case collapse; verdicts never round up</text>

  <rect x="548" y="320" width="364" height="42" rx="8" fill="#FFFFFF" stroke="#4A82C4" stroke-width="1.1"/>
  <text x="562" y="338" font-size="10" font-weight="bold" fill="#14161C">content addressing</text>
  <text x="562" y="353" font-size="9" fill="#4A5160">claims, obligations, evidence, artifacts — identity is a hash, dedup is free</text>

  <!-- caveat band -->
  <rect x="30" y="392" width="900" height="66" rx="10" fill="#FBF1DF" stroke="#B07407" stroke-width="1.2"/>
  <text x="50" y="415" font-size="10.5" font-weight="bold" fill="#B07407">the two guarantees that are signed, not gated</text>
  <text x="50" y="432" font-size="9.5" fill="#4A5160">the compiler's equivalence decomposition (no missing / no excess obligations) and the oracle's method sufficiency are LLM judgments</text>
  <text x="50" y="447" font-size="9.5" fill="#4A5160">that no downstream gate re-checks — the design makes them named, signed, and disclosed on the certificate: accountability, not prevention</text>

  <text x="480" y="484" font-size="9.5" fill="#8B92A1" text-anchor="middle" font-style="italic">memory (obligation / attack / instrument stores) feeds prompt slots only — a hit can speed the system up, never flip a verdict</text>
</svg>
