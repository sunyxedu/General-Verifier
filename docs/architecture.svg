<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">General Verifier architecture</title>
  <desc id="desc">The original task is compiled into checks and reviewed for coverage, with feedback to revise the checks. The resulting task contract enters a verification loop: propose a method, execute it using retained inputs and captured files, and audit its evidence. Audit feedback can retry the method. The verification kernel enforces evidence rules and retains artifacts. The final certificate links the verdict to the checks, evidence, and unresolved issues. This diagram focuses on completion checks; the reconstructed claim graph remains available for inspection.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#526476"/></marker>
    <marker id="feedback" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#8a6bac"/></marker>
    <marker id="input-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#4c81a9"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #243444; }
      .heading { font-size: 23px; font-weight: 600; text-anchor: middle; }
      .label { font-size: 21px; font-weight: 500; text-anchor: middle; }
      .detail { font-size: 18px; fill: #526476; }
      .flow { fill: none; stroke: #526476; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #8a6bac; stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; marker-end: url(#feedback); }
      .input { fill: none; stroke: #4c81a9; stroke-width: 2; stroke-linejoin: round; marker-end: url(#input-arrow); }
      .reasoning { fill: #f5f0fa; stroke: #b39acb; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1120" height="520" fill="#ffffff"/>

  <!-- Four stages, with artifacts distinct from the processes that act on them. -->
  <text x="108" y="43" class="heading">Task and run</text>
  <text x="360" y="43" class="heading">Define success</text>
  <text x="690" y="43" class="heading">Establish evidence</text>
  <text x="1007" y="43" class="heading">Inspect result</text>

  <!-- Original task and inputs are the authority for completion checks. -->
  <path d="M19 111H174L198 135V191H19Z" fill="#f0f7fc" stroke="#91b4cf" stroke-width="1.5"/>
  <path d="M174 111V135H198" fill="none" stroke="#91b4cf" stroke-width="1.5"/>
  <text x="35" y="148" font-size="21" font-weight="600">Original task</text>
  <text x="35" y="175" class="detail">Required outcome</text>
  <path d="M199 151H248" class="flow"/>

  <!-- Reviewed task contract. -->
  <rect x="250" y="118" width="220" height="66" rx="7" class="reasoning"/>
  <text x="360" y="157" class="label">Compile checks</text>
  <path d="M360 185V220" class="flow"/>
  <rect x="250" y="223" width="220" height="66" rx="7" class="reasoning"/>
  <text x="360" y="262" class="label">Review coverage</text>
  <path d="M470 248H491V151H473" class="feedback"/>
  <rect x="467" y="193" width="49" height="22" fill="#fff"/>
  <text x="491" y="209" text-anchor="middle" font-size="16" fill="#765591">Revise</text>
  <path d="M360 290V329" class="flow"/>
  <path d="M250 332H449L470 353V400H250Z" fill="#fff" stroke="#a4b3c0" stroke-width="1.5"/>
  <path d="M449 332V353H470" fill="none" stroke="#a4b3c0" stroke-width="1.5"/>
  <text x="360" y="359" class="label">Task contract</text>
  <text x="360" y="385" class="detail" text-anchor="middle">Required checks</text>
  <path d="M471 365H522V151H565" class="flow"/>

  <!-- Verification loop; the executor receives the retained run, not just text checks. -->
  <rect x="567" y="118" width="242" height="66" rx="7" class="reasoning"/>
  <text x="688" y="157" class="label">Propose a method</text>
  <path d="M688 185V220" class="flow"/>
  <rect x="567" y="223" width="242" height="66" rx="7" fill="#eef7f4" stroke="#89b7a8" stroke-width="1.5"/>
  <text x="688" y="262" class="label">Execute with tools</text>
  <path d="M688 290V327" class="flow"/>
  <rect x="567" y="330" width="242" height="70" rx="7" class="reasoning"/>
  <text x="688" y="360" class="label">Audit the evidence</text>
  <text x="688" y="386" class="detail" text-anchor="middle">Method + execution</text>
  <path d="M810 349H843V151H812" class="feedback"/>
  <rect x="822" y="193" width="42" height="22" fill="#fff"/>
  <text x="843" y="209" text-anchor="middle" font-size="16" fill="#765591">Retry</text>

  <!-- Captured context can inform compilation; retained evidence also feeds execution. -->
  <rect x="24" y="282" width="174" height="114" rx="3" fill="#fff" stroke="#b5c7d5" stroke-width="1.5"/>
  <rect x="18" y="276" width="174" height="114" rx="3" fill="#f0f7fc" stroke="#91b4cf" stroke-width="1.5"/>
  <text x="34" y="308" font-size="20" font-weight="600">Captured run</text>
  <text x="34" y="337" class="detail">Trace + response</text>
  <text x="34" y="365" class="detail">Inputs + files</text>
  <path d="M193 304H218V169H248" class="flow"/>
  <path d="M199 345H224V444H548V256H565" class="input"/>
  <rect x="257" y="429" width="255" height="28" fill="#fff"/>
  <text x="384" y="449" class="detail" text-anchor="middle" style="fill:#4c81a9">Retained inputs and files</text>

  <!-- Accepted checks, refutations, and unresolved checks all remain inspectable. -->
  <path d="M810 379H879V256H908" class="flow"/>
  <path d="M911 165H1075L1100 190V354H911Z" fill="#fbfcfd" stroke="#9aafbf" stroke-width="1.5"/>
  <path d="M1075 165V190H1100" fill="none" stroke="#9aafbf" stroke-width="1.5"/>
  <text x="929" y="207" font-size="22" font-weight="600">Certificate</text>
  <path d="M929 225H1080" stroke="#d4dfe7" stroke-width="1.5"/>
  <circle cx="934" cy="249" r="4" fill="#4c81a9"/>
  <text x="948" y="256" font-size="20">Verdict</text>
  <text x="929" y="285" class="detail">Checks</text>
  <path d="M934 294V308H945" fill="none" stroke="#9aafbf" stroke-width="1.5"/>
  <text x="952" y="315" class="detail">Evidence</text>
  <text x="929" y="343" class="detail">Open questions</text>

  <path d="M250 481H844" stroke="#d8e0e7"/>
  <text x="547" y="507" class="detail" text-anchor="middle"><tspan font-weight="600">Kernel</tspan> · enforces evidence rules and retains artifacts</text>
</svg>
