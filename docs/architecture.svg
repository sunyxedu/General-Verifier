<?xml version="1.0" encoding="UTF-8"?>
<svg width="940" height="756" viewBox="0 0 940 756" role="img" aria-label="General Verifier architecture" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="756" fill="#FDFDFB"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#55534C"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#A5A399"/>
    </marker>
    <marker id="arv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7A5CC9"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F7D3A"/>
    </marker>
    <marker id="arm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8C8A80"/>
    </marker>
  </defs>

  <!-- ================= SOLVER (external) ================= -->
  <rect x="24" y="20" width="536" height="88" rx="10" fill="#FFFFFF" stroke="#AFADA3" stroke-width="1.3"/>
  <circle cx="44" cy="42" r="9" fill="#201F1D"/><text x="44" y="45.5" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="bold">1</text>
  <text x="60" y="46" font-size="11.5" font-weight="bold" fill="#201F1D">SOLVER — stock Claude Code session</text>
  <text x="60" y="61" font-size="8.2" fill="#55534C">unmodified: works normally with its own tools (Bash, Edit, …)</text>
  <rect x="60" y="68" width="120" height="26" rx="13" fill="#FDFDFB" stroke="#B9B7AE" stroke-width="1"/>
  <text x="120" y="84.5" text-anchor="middle" font-size="8" fill="#201F1D">hooks: Pre/PostToolUse</text>
  <rect x="276" y="68" width="120" height="26" rx="13" fill="#FDFDFB" stroke="#B9B7AE" stroke-width="1"/>
  <text x="336" y="84.5" text-anchor="middle" font-size="8" fill="#201F1D">MCP client: gv.* verbs</text>

  <!-- legend (top right) -->
  <rect x="584" y="20" width="332" height="88" rx="8" fill="#FFFFFF" stroke="#D8D6CD" stroke-width="1"/>
  <rect x="602" y="36" width="12" height="12" rx="3" fill="#FCEADD" stroke="#D97A33" stroke-width="1.2"/>
  <text x="622" y="46" font-size="7.8" fill="#55534C">LLM seat — proposes (efficiency only)</text>
  <rect x="602" y="62" width="12" height="12" rx="3" fill="#E2EDF8" stroke="#3D78B8" stroke-width="1.2"/>
  <text x="622" y="72" font-size="7.8" fill="#55534C">mechanical — decides (correctness)</text>
  <rect x="790" y="36" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#A9A79D" stroke-width="1.2"/>
  <text x="810" y="46" font-size="7.8" fill="#55534C">data at rest</text>
  <rect x="790" y="62" width="12" height="12" rx="3" fill="#FDFDFB" stroke="#8C8A80" stroke-width="1.2" stroke-dasharray="3.5 2.5"/>
  <text x="810" y="72" font-size="7.8" fill="#55534C">advisory / feedback</text>

  <!-- solver -> sidecar arrows -->
  <line x1="120" y1="94" x2="120" y2="170" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>
  <circle cx="140" cy="118" r="8" fill="#201F1D"/><text x="140" y="121.3" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">2</text>
  <text x="154" y="115" font-size="7.8" fill="#55534C">every tool call &amp; result,</text>
  <text x="154" y="126" font-size="7.8" fill="#55534C">as raw JSONL lines</text>
  <line x1="336" y1="94" x2="336" y2="162" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="348" y="113" font-size="7.8" fill="#55534C">gv.commit · gv.verify · gv.certificate ·</text>
  <text x="348" y="124" font-size="7.8" fill="#55534C">gv.status · gv.branches — over stdio;</text>
  <text x="348" y="135" font-size="7.8" fill="#55534C">state-changing calls become events</text>

  <!-- ================= SIDECAR zone ================= -->
  <rect x="24" y="140" width="892" height="512" rx="12" fill="#F8F8F4" stroke="#CFCDC4" stroke-width="1.2"/>
  <text x="48" y="158" font-size="10" font-weight="bold" fill="#6B6960" letter-spacing="1.8">SIDECAR — THE VERIFIER, A SEPARATE PROCESS</text>

  <!-- ingestion row -->
  <rect x="48" y="172" width="156" height="68" rx="8" fill="#FFFFFF" stroke="#A9A79D" stroke-width="1.1"/>
  <path d="M 190 172 L 204 186 L 190 186 Z" fill="#EDEBE4" stroke="#A9A79D" stroke-width="0.8"/>
  <text x="126" y="192" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#201F1D">hook feed</text>
  <text x="126" y="207" text-anchor="middle" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#55534C">.gv/hook_feed.jsonl</text>
  <text x="126" y="221" text-anchor="middle" font-size="7.5" fill="#8C8A80">raw · no seq · many writers</text>
  <line x1="204" y1="206" x2="232" y2="206" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="218" y="198" text-anchor="middle" font-size="7.3" fill="#8C8A80">drained</text>

  <rect x="236" y="166" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#4E4C45" stroke-width="1.7"/>
  <circle cx="254" cy="172" r="8" fill="#201F1D"/><text x="254" y="175.3" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">3</text>
  <text x="336" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#201F1D">EVENT STREAM</text>
  <text x="336" y="204" text-anchor="middle" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#55534C">events.jsonl</text>
  <text x="336" y="219" text-anchor="middle" font-size="8" fill="#55534C">append-only ledger · seq-validated</text>
  <text x="336" y="233" text-anchor="middle" font-size="8" font-style="italic" fill="#55534C">the only input and the only log</text>
  <line x1="436" y1="206" x2="464" y2="206" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="468" y="172" width="160" height="68" rx="8" fill="#E2EDF8" stroke="#3D78B8" stroke-width="1.4"/>
  <circle cx="486" cy="178" r="8" fill="#201F1D"/><text x="486" y="181.3" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">4</text>
  <text x="548" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#201F1D">BUILDER</text>
  <text x="548" y="213" text-anchor="middle" font-size="8" fill="#55534C">deterministic events → claims</text>
  <text x="548" y="227" text-anchor="middle" font-size="8" fill="#55534C">no LLM</text>
  <line x1="628" y1="206" x2="656" y2="206" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- claim store: cylinder -->
  <path d="M 660 175 L 660 237 A 116 9 0 0 0 892 237 L 892 175" fill="#FFFFFF" stroke="#A9A79D" stroke-width="1.1"/>
  <ellipse cx="776" cy="175" rx="116" ry="9" fill="#FFFFFF" stroke="#A9A79D" stroke-width="1.1"/>
  <text x="776" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#201F1D">CLAIM STORE</text>
  <text x="776" y="214" text-anchor="middle" font-size="8" fill="#55534C">SQLite · claim DAG + obligation nodes</text>
  <text x="776" y="228" text-anchor="middle" font-size="7.5" fill="#8C8A80">status machine · content-addressed</text>

  <!-- trigger elbow -->
  <path d="M 776 247 L 776 268 L 182 268 L 182 282" fill="none" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>
  <circle cx="200" cy="262" r="8" fill="#201F1D"/><text x="200" y="265.3" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold">5</text>
  <text x="214" y="265" font-size="8" font-style="italic" fill="#55534C">the single trigger rule — verify a claim the moment it gains its first dependent</text>

  <!-- ================= KERNEL zone ================= -->
  <rect x="48" y="284" width="844" height="272" rx="10" fill="#EFF4FA" stroke="#9DBBDC" stroke-width="1.3"/>
  <circle cx="68" cy="306" r="9" fill="#201F1D"/><text x="68" y="309.5" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="bold">6</text>
  <text x="84" y="310" font-size="11" font-weight="bold" fill="#201F1D">KERNEL — verifies one claim at a time</text>

  <!-- compiler -->
  <rect x="68" y="330" width="228" height="68" rx="8" fill="#FCEADD" stroke="#D97A33" stroke-width="1.3"/>
  <text x="182" y="346" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#201F1D">GRAPH-AWARE COMPILER</text>
  <text x="182" y="360" text-anchor="middle" font-size="7.6" fill="#55534C">answer-blind — sees the statement + graph,</text>
  <text x="182" y="372" text-anchor="middle" font-size="7.6" fill="#55534C">never the argument · residual on verified premises</text>
  <text x="182" y="384" text-anchor="middle" font-size="7.6" fill="#55534C">reuses proven statements word for word · no count cap</text>
  <line x1="296" y1="364" x2="324" y2="364" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- obligation nodes: mini-graph inset -->
  <rect x="328" y="318" width="228" height="92" rx="8" fill="#FFFFFF" stroke="#7FA8D6" stroke-width="1.2"/>
  <text x="442" y="333" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#201F1D">OBLIGATION NODES — into the graph</text>
  <circle cx="366" cy="357" r="10" fill="#FDFDFB" stroke="#A9A79D" stroke-width="1.1"/>
  <text x="366" y="360" text-anchor="middle" font-size="7" fill="#55534C">A1</text>
  <circle cx="366" cy="386" r="10" fill="#FDFDFB" stroke="#A9A79D" stroke-width="1.1"/>
  <text x="366" y="389" text-anchor="middle" font-size="7" fill="#55534C">A2</text>
  <line x1="377" y1="360" x2="430" y2="370" stroke="#8C8A80" stroke-width="1" marker-end="url(#arm)"/>
  <line x1="377" y1="383" x2="430" y2="377" stroke="#8C8A80" stroke-width="1" marker-end="url(#arm)"/>
  <rect x="434" y="360" width="28" height="28" rx="6" fill="#E2EDF8" stroke="#3D78B8" stroke-width="1.2"/>
  <text x="448" y="377.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#201F1D">O</text>
  <circle cx="463" cy="359" r="7" fill="#2F7D3A"/>
  <text x="463" y="362" text-anchor="middle" font-size="7.5" fill="#FFFFFF" font-weight="bold">✓</text>
  <rect x="478" y="335" width="70" height="17" rx="8.5" fill="#E7F3E8" stroke="#2F7D3A" stroke-width="1"/>
  <text x="513" y="346.5" text-anchor="middle" font-size="7" fill="#2F7D3A">settled claim ✓</text>
  <line x1="504" y1="352" x2="464" y2="364" stroke="#2F7D3A" stroke-width="1" stroke-dasharray="3 2.5" marker-end="url(#arg)"/>
  <text x="506" y="369" text-anchor="middle" font-size="6.8" font-style="italic" fill="#2F7D3A">same text ⇒ inherit</text>
  <text x="442" y="404" text-anchor="middle" font-size="7.4" fill="#8C8A80">identical text ⇒ one node · settled verdicts transfer free</text>
  <line x1="556" y1="364" x2="584" y2="364" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="570" y="378" text-anchor="middle" font-size="6.8" fill="#8C8A80">per node</text>

  <!-- binding game breakout -->
  <rect x="588" y="310" width="284" height="226" rx="10" fill="#FFFFFF" stroke="#BFBDB4" stroke-width="1.1"/>
  <text x="730" y="328" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#6B6960" letter-spacing="1">BINDING GAME — PER OBLIGATION NODE</text>
  <rect x="604" y="336" width="252" height="44" rx="7" fill="#FCEADD" stroke="#D97A33" stroke-width="1.3"/>
  <text x="730" y="352" text-anchor="middle" font-size="9" font-weight="bold" fill="#201F1D">ORACLE — sufficient methods only</text>
  <text x="730" y="366" text-anchor="middle" font-size="7.4" fill="#55534C">self-graded levels, ascending · researches unfamiliar domains first</text>
  <line x1="730" y1="380" x2="730" y2="392" stroke="#55534C" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="604" y="394" width="252" height="44" rx="7" fill="#FCEADD" stroke="#D97A33" stroke-width="1.3"/>
  <text x="730" y="410" text-anchor="middle" font-size="9" font-weight="bold" fill="#201F1D">DISCHARGE — faithful execution</text>
  <text x="730" y="424" text-anchor="middle" font-size="7.4" fill="#55534C">installs missing instruments · truly unobtainable ⇒ partial</text>
  <line x1="668" y1="438" x2="668" y2="456" stroke="#55534C" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M 856 478 C 868 474 868 420 856 416" fill="none" stroke="#7A5CC9" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arv)"/>
  <text x="756" y="451" text-anchor="middle" font-size="7" fill="#7A5CC9">reason back · redo ≤3 · blind re-judge</text>
  <rect x="604" y="456" width="252" height="44" rx="7" fill="#FCEADD" stroke="#D97A33" stroke-width="1.3"/>
  <text x="730" y="472" text-anchor="middle" font-size="9" font-weight="bold" fill="#201F1D">JUDGER — was the result faithful?</text>
  <text x="730" y="486" text-anchor="middle" font-size="7.4" fill="#55534C">opens the artifact itself · reruns when in doubt</text>
  <text x="730" y="515" text-anchor="middle" font-size="7.3" fill="#8C8A80">refuted ⇒ short-circuit, settle with witness · faithful ⇒ bound</text>
  <text x="730" y="527" text-anchor="middle" font-size="7.3" fill="#8C8A80">rejected ⇒ next method · exhausted ⇒ failed / unobtainable ⇒ partial</text>

  <!-- memory (advisory) -->
  <rect x="68" y="448" width="228" height="68" rx="8" fill="#FDFDFB" stroke="#8C8A80" stroke-width="1.1" stroke-dasharray="4.5 3"/>
  <path d="M 86 468 L 86 490 A 10 4 0 0 0 106 490 L 106 468" fill="#FDFDFB" stroke="#8C8A80" stroke-width="1"/>
  <ellipse cx="96" cy="468" rx="10" ry="4" fill="#FDFDFB" stroke="#8C8A80" stroke-width="1"/>
  <text x="200" y="470" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#55534C">MEMORY — advisory only</text>
  <text x="200" y="484" text-anchor="middle" font-size="7.5" fill="#55534C">obligation · attack · instrument patterns</text>
  <text x="200" y="497" text-anchor="middle" font-size="7.3" font-style="italic" fill="#8C8A80">retrieval into prompt slots — nothing else</text>
  <line x1="182" y1="448" x2="182" y2="402" stroke="#8C8A80" stroke-width="1.1" stroke-dasharray="4.5 3" marker-end="url(#arb)"/>

  <!-- settlement footnote -->
  <text x="470" y="548" text-anchor="middle" font-size="7.8" font-style="italic" fill="#6B6960">a claim's status = the fold of its obligation nodes — any refuted node refutes the claim and hard-kills its downstream cone</text>

  <!-- kernel -> certificate -->
  <line x1="470" y1="556" x2="470" y2="574" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ================= CERTIFICATE ================= -->
  <rect x="48" y="576" width="844" height="64" rx="10" fill="#E2EDF8" stroke="#3D78B8" stroke-width="1.4"/>
  <circle cx="68" cy="598" r="9" fill="#201F1D"/><text x="68" y="601.5" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="bold">7</text>
  <text x="84" y="596" font-size="10.5" font-weight="bold" fill="#201F1D">CERTIFICATE — the final claim's slice, frozen</text>
  <text x="84" y="611" font-size="7.8" fill="#55534C">each claim entry nests its obligation nodes with their evidence · assurance levels disclosed · returned over MCP</text>
  <rect x="84" y="618" width="54" height="15" rx="7.5" fill="#0CA30C" fill-opacity="0.13" stroke="#0A7D0A" stroke-width="1"/>
  <text x="111" y="629" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#0A7D0A">verified</text>
  <rect x="146" y="618" width="48" height="15" rx="7.5" fill="#FAB219" fill-opacity="0.16" stroke="#A36E00" stroke-width="1"/>
  <text x="170" y="629" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#A36E00">partial</text>
  <rect x="202" y="618" width="62" height="15" rx="7.5" fill="#FFFFFF" stroke="#8C8A80" stroke-width="1"/>
  <text x="233" y="629" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#55534C">unverified</text>
  <rect x="272" y="618" width="50" height="15" rx="7.5" fill="#D03B3B" fill-opacity="0.11" stroke="#C24541" stroke-width="1"/>
  <text x="297" y="629" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#C24541">refuted</text>
  <text x="336" y="629" font-size="7.4" fill="#55534C">verdict = the worst case over the slice — refuted ≻ unverified/stale ≻ partial ≻ verified · never rounds up</text>

  <!-- sidecar -> consumer -->
  <line x1="470" y1="652" x2="470" y2="668" stroke="#55534C" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ================= CONSUMER (external) ================= -->
  <rect x="250" y="670" width="440" height="64" rx="10" fill="#FFFFFF" stroke="#AFADA3" stroke-width="1.3"/>
  <circle cx="272" cy="692" r="9" fill="#201F1D"/><text x="272" y="695.5" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="bold">8</text>
  <text x="288" y="696" font-size="10.5" font-weight="bold" fill="#201F1D">CONSUMER / CI — where enforcement lives</text>
  <text x="288" y="711" font-size="7.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#55534C">uv run python -m verifier.cli certify …</text>
  <text x="288" y="724" font-size="7.6" fill="#8C8A80">merges only on a verified certificate (exit 0)</text>
</svg>
