<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">General Verifier: from a finished run to an inspectable verdict</title>
  <desc id="desc">The original task, recorded tool events and captured deliverables enter a pipeline that defines task checks, executes and audits them, and produces a certificate. Multiple attempts can be compared by verdict and advisory violations. Models interpret and audit evidence; the kernel enforces declared contracts.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #0f172a; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 19px; fill: #334155; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="620" rx="20" fill="#f8fafc"/>
  <text x="40" y="57" font-size="30" font-weight="750">General Verifier</text>
  <text x="40" y="94" font-size="21" fill="#475569">A finished agent run → explicit task checks → a verdict you can inspect</text>

  <rect x="32" y="146" width="278" height="238" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="52" y="181" class="label" style="fill:#1d4ed8">1 · CAPTURE</text>
  <text x="52" y="220" class="heading">Read the run</text>
  <text x="52" y="259" class="body">Original task and inputs</text>
  <text x="52" y="290" class="body">Tool calls and results</text>
  <text x="52" y="321" class="body">Final response</text>
  <text x="52" y="352" class="body">Captured deliverables</text>

  <path d="M313 263 H339" class="arrow"/>
  <rect x="344" y="146" width="278" height="238" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="364" y="181" class="label" style="fill:#92400e">2 · DEFINE</text>
  <text x="364" y="220" class="heading">Define success</text>
  <text x="364" y="259" class="body">Extract claims and links</text>
  <text x="364" y="290" class="body">Compile task checks</text>
  <text x="364" y="321" class="body">Critic reviews coverage</text>
  <text x="364" y="352" class="body">Kernel validates contracts</text>

  <path d="M625 263 H651" class="arrow"/>
  <rect x="656" y="146" width="278" height="238" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="676" y="181" class="label" style="fill:#92400e">3 · CHECK</text>
  <text x="676" y="220" class="heading">Check the evidence</text>
  <text x="676" y="259" class="body">Propose a method</text>
  <text x="676" y="290" class="body">Run it; retain artifacts</text>
  <text x="676" y="321" class="body">Audit method and results</text>
  <text x="676" y="352" class="body">Record gaps and failures</text>

  <path d="M937 263 H963" class="arrow"/>
  <rect x="968" y="146" width="278" height="238" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="988" y="181" class="label" style="fill:#166534">4 · CERTIFY</text>
  <text x="988" y="220" class="heading">Explain the result</text>
  <text x="988" y="259" class="body">Final verdict</text>
  <text x="988" y="290" class="body">Every check and its status</text>
  <text x="988" y="321" class="body">Evidence and its limits</text>
  <text x="988" y="352" class="body">Counterexamples</text>

  <rect x="32" y="416" width="1214" height="118" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="54" y="454" class="heading">Several attempts at the same task?</text>
  <text x="54" y="490" class="body">Score each separately. Compare verdicts, then advisory violations. Keep equal ranks as explicit ties.</text>
  <text x="40" y="577" font-size="18" fill="#475569">Models interpret and audit evidence. The kernel enforces declared rules. A certificate remains a model-dependent judgment.</text>
</svg>
